<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Разбей что угодно</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--card:#fff;--bar:#d93a2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1c;--fg:#f2f2f2;--card:#2a2a2d}}
:root[data-theme="dark"]{--bg:#1a1a1c;--fg:#f2f2f2;--card:#2a2a2d}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:20px;margin:14px 0 6px}.bar{width:min(86vw,420px);height:14px;background:var(--card);border-radius:8px;overflow:hidden}
#fill{height:100%;width:0;background:var(--bar);transition:width .1s}#cnt{margin:6px 0;font-size:15px}
#stage{position:relative;width:min(94vw,520px);flex:1;max-height:420px;margin:6px 0;overflow:hidden;border-radius:16px;background:var(--card)}
#car,#blood{position:absolute;left:50%;top:50%;width:80%;transform:translate(-50%,-50%);cursor:pointer}
#car svg,#car img{width:100%;display:block;pointer-events:none}#blood{width:70%;display:none;pointer-events:none}
#cr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.h{position:absolute;width:110px;pointer-events:none;transform-origin:50% 95%;animation:sw .28s ease-in forwards}
@keyframes sw{0%{transform:rotate(55deg);opacity:0}25%{opacity:1}70%{transform:rotate(0)}100%{transform:rotate(-8deg);opacity:0}}
.shake{animation:sh .12s}@keyframes sh{25%{transform:translate(-50%,-50%) translateX(-6px) rotate(-1deg)}75%{transform:translate(-50%,-50%) translateX(6px) rotate(1deg)}}
.pop{animation:pp .5s ease-out}@keyframes pp{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.btns{display:flex;gap:10px;margin:6px 0 14px}button,label{background:var(--card);color:var(--fg);border:1px solid #8884;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
</style></head><body>

let n=0,done=false,ac;
function thud(){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.setValueAtTime(160,ac.currentTime);o.frequency.exponentialRampToValueAtTime(40,ac.currentTime+.12);g.gain.setValueAtTime(.5,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.16)}catch(e){}}
function crack(x,y){let d="M"+x+" "+y,a=Math.random()*6.28,L=10+Math.random()*30;for(let i=0;i<3;i++){a+=(Math.random()-.5)*1.2;x+=Math.cos(a)*L/3;y+=Math.sin(a)*L/3;d+=" L"+x.toFixed(0)+" "+y.toFixed(0)}
const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",d);p.setAttribute("stroke","#111");p.setAttribute("stroke-width","1.6");p.setAttribute("fill","none");cr.appendChild(p)}
car.addEventListener("pointerdown",e=>{if(done)return;const r=st.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
const h=document.createElement("img");h.src=HAM;h.className="h";h.style.left=(x-33)+"px";h.style.top=(y-17)+"px";st.appendChild(h);setTimeout(()=>h.remove(),300);
setTimeout(()=>{thud();n++;crack(x,y);crack(x,y);car.classList.remove("shake");void car.offsetWidth;car.classList.add("shake");
car.style.filter="brightness("+(1-n/N*.45)+") saturate("+(1-n/N*.5)+")";
document.getElementById("fill").style.width=n/N*100+"%";document.getElementById("cnt").textContent=n+" / "+N;if(n>=N)smash()},190)});
function smash(){done=true;car.style.display="none";cr.innerHTML="";blood.style.display="block";blood.className="pop";document.getElementById("cnt").textContent="Разбита! 💥"}
document.getElementById("re").onclick=()=>{n=0;done=false;car.style.display="";car.style.filter="";blood.style.display="none";cr.innerHTML="";document.getElementById("fill").style.width="0";document.getElementById("cnt").textContent="0 / "+N};
document.getElementById("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.src=URL.createObjectURL(f);car.innerHTML="";car.appendChild(i)};
